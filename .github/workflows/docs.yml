name: docs

# DESPLIEGUE DE DOCUMENTACION — MANUAL, NUNCA AUTOMATICO.
#
# Manual, nunca automatico: los runners NO se disparan en cada push
# (compilar el libro es trabajo local). Este workflow existe solo como
# red de seguridad para reconstruir gh-pages desde otro equipo.
#
# NO anadir `push:` ni `schedule:` a proposito.

on:
  workflow_dispatch:
    inputs:
      clean:
        description: "Rebuild from scratch (drop stale HTML)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Gate: public surface (forbidden files, license, secrets)"
        run: |
          set -eu
          fail=0

          # 1. Ningun fichero de fuente interna dentro de la superficie publica.
          #    Solo tipos de fichero: este gate no nombra el stack. La politica
          #    de contenido vive en el repo privado, no aqui.
          leaked=$(find docs -type f \( -name '*.rs' -o -name 'Cargo.toml' \
                    -o -name '*.ld' -o -name '.env' -o -name '*.pem' \))
          if [ -n "$leaked" ]; then
            echo "::error::Forbidden source file inside the public docs surface"
            echo "$leaked"
            fail=1
          fi

          # 2. Licencia: nuestro SPDX es BUSL-1.1. `BSL-1.1` solo se tolera en
          #    la linea educativa que explica que NO es el nuestro.
          bad=$(grep -rn 'BSL-1\.1' docs/src | grep -v 'BUSL-1\.1' | grep -v 'unrelated permissive' || true)
          if [ -n "$bad" ]; then
            echo "::error::Licencia: BSL-1.1 (Boost en SPDX) donde debe ir BUSL-1.1"
            echo "$bad"
            fail=1
          fi

          # 3. Sin credenciales
          if grep -rniE 'api[_-]?key[[:space:]]*=|password[[:space:]]*=|ghp_[A-Za-z0-9]+|AKIA[0-9A-Z]{16}' docs; then
            echo "::error::Posible secreto en docs/"
            fail=1
          fi

          exit $fail

      - name: "Gate: book inventory (four-state matrix)"
        run: |
          set -eu
          # Estado 3 (deberia existir y falta): toda pagina de SUMMARY.md existe
          grep -oE '\([a-z0-9_-]+\.md\)' docs/src/SUMMARY.md | tr -d '()' | sort -u | while read -r f; do
            [ -f "docs/src/$f" ] || { echo "::error::SUMMARY apunta a pagina inexistente: $f"; exit 1; }
          done
          # Estado 4 (no deberia existir y esta): ninguna pagina fuera de SUMMARY
          for f in docs/src/*.md; do
            b=$(basename "$f")
            [ "$b" = "SUMMARY.md" ] && continue
            grep -q "($b)" docs/src/SUMMARY.md || { echo "::error::pagina fuera de SUMMARY: $b"; exit 1; }
          done
          # Enlaces internos rotos
          grep -rhoE '\]\([a-z0-9_-]+\.md' docs/src | sed 's/](//' | sort -u | while read -r f; do
            [ -f "docs/src/$f" ] || { echo "::error::enlace roto: $f"; exit 1; }
          done
          echo "inventario OK"

      - name: Install mdBook
        run: |
          set -eu
          MDBOOK_VERSION=0.4.52
          curl -sSL -o /tmp/mdbook.tar.gz \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/mdbook.tar.gz -C /tmp
          /tmp/mdbook --version

      - name: Build the book
        run: /tmp/mdbook build docs

      - name: Assemble gh-pages tree
        run: |
          set -eu
          rm -rf _site
          mkdir -p _site/docs
          # Fuente + build en docs/, que es la carpeta que Pages sirve
          cp -r docs _site/docs/
          # La raiz del sitio debe responder 200, no 404
          cat > _site/docs/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=./book/">
              <title>b4n1-boost documentation</title>
              <link rel="canonical" href="./book/">
            </head>
            <body>
              <p>Redirecting to the <a href="./book/">b4n1-boost manual</a>.</p>
            </body>
          </html>
          HTML
          test -f _site/docs/book/index.html

      # Despliegue con git plano sobre la rama gh-pages. Sin acciones de
      # terceros (no third-party actions) y sin dependencias de suministro: solo el
      # runner, git y el token del propio repositorio.
      - name: Deploy to gh-pages
        run: |
          set -eu
          branch="gh-pages"
          work="$(mktemp -d)"
          git init -q "$work"
          git -C "$work" config user.name "github-actions[bot]"
          git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$work" remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Historia anterior conservada solo si es un arbol de despliegue.
          if git fetch -q origin "$branch" 2>/dev/null; then
            git -C "$work" checkout -q -B "$branch" FETCH_HEAD
          else
            git -C "$work" checkout -q --orphan "$branch"
          fi

          find "$work" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r _site/. "$work/"
          git -C "$work" add -A
          if git -C "$work" diff --cached --quiet; then
            echo "gh-pages unchanged"
          else
            git -C "$work" commit -q -m "docs: rebuild book from ${GITHUB_SHA}"
            git -C "$work" push -q origin "$branch"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
