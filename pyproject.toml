[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "b4n1-boost"
version = "0.1.0"
description = "B4N1-BOOST — Transparent middleware accelerator for Django, FastAPI and Flask"
readme = "README.md"
requires-python = ">=3.10"

[tool.maturin]
features = ["python"]
python-source = "python"
module-name = "b4n1_boost._core"
